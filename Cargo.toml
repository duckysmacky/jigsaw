[workspace]
resolver = "3"
members = [
	"bencode",
	"core", 
	"cli", 
]

[workspace.package]
version = "0.1.0"
edition = "2024"
authors = [
	"Nikita Doronin (duckysmacky)",
	"Grigoriy Agasyants (shroomwastaken)"
]
repository = "https://github.com/duckysmacky/jigsaw"

[workspace.dependencies]
# workspace
jigsaw-bencode = { version = "0.1.0", path = "./bencode" }
jigsaw-core = { version = "0.1.0", path = "./core" }

clap = "4.6.6"
tokio = "1.53.1"
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
rand = "0.10.2"
thiserror = "2.0.20"
tokio-util = "0.7.19"
ureq = "3.4.0"
anyhow = "1.0.104"
hex = "0.4.3"
